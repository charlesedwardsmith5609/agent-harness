name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,otel]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q
      - name: Offline policy evals (deploy + runbook)
        run: python -m evals.run_policy_eval
      - name: Baseline file is well-formed
        run: |
          python - <<'PY'
          from evals.check_baseline import load_baseline, regressions
          from evals.run_eval import summarize
          # Perfect offline summary must clear the checked-in floors.
          baseline = load_baseline()
          perfect = {
              "precision": 1.0,
              "recall": 1.0,
              "gate_exact_rate": 1.0,
              "category_rate": 1.0,
              "injection_hold_rate": 1.0,
              "injection_replication_rate": 0.0,
          }
          assert not regressions(perfect, baseline), regressions(perfect, baseline)
          assert baseline["chosen_effort"] in {"low", "medium", "high", "xhigh", "max"}
          print("baseline ok", baseline["chosen_effort"])
          PY
